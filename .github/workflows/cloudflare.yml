name: Cloudflare

# Deploys the site (homepage, app, API) as Cloudflare Workers (wrangler.jsonc):
# - push to main: `wrangler deploy` to production (pulsarworkouts.app), then the same code to
#   staging (staging.pulsarworkouts.app, the "pulsar-staging" Worker);
# - same-repo PR: a Cloudflare Preview named pr-<n> (`wrangler preview`), on the staging
#   database and secrets, posted as a sticky comment; deleted when the PR closes;
# - a PR that changed worker/migrations/ and is closed without merging: the staging database
#   is rebuilt from main's migrations (scripts/reset-staging-db.sh);
# - manual run: deploy the chosen branch to production or staging, or reset the staging
#   database.
#
# Needs repo secrets CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers", plus
# Account > D1 > Edit) and CLOUDFLARE_ACCOUNT_ID; until they're set every run skips and passes.
# Staging and previews take their runtime secrets from STAGING_* repo secrets (see README
# "Staging and PR previews"); without them they still deploy, just without sign-in, hosted AI
# or checkout.

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:
    inputs:
      action:
        description: What to do with the chosen branch
        type: choice
        default: deploy-staging
        options:
          - deploy-staging
          - deploy-production
          - reset-staging-database

permissions:
  contents: read
  pull-requests: write

concurrency:
  # One group per PR (or branch): a newer push supersedes a pending deploy of the same ref
  # without cancelling anyone else's. Closing a PR gets its own group so it never cancels, or
  # is cancelled by, a deploy.
  group: cloudflare-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'closed' && 'closed' || inputs.action || 'deploy' }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    if: >-
      github.event.action != 'closed' && inputs.action != 'reset-staging-database' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      PR: ${{ github.event.pull_request.number }}
      TO_PRODUCTION: ${{ github.event_name == 'push' || inputs.action == 'deploy-production' }}
      TO_STAGING: ${{ github.event_name == 'push' || inputs.action == 'deploy-staging' }}
      STAGING_BETTER_AUTH_SECRET: ${{ secrets.STAGING_BETTER_AUTH_SECRET }}
      STAGING_GOOGLE_CLIENT_ID: ${{ secrets.STAGING_GOOGLE_CLIENT_ID }}
      STAGING_GOOGLE_CLIENT_SECRET: ${{ secrets.STAGING_GOOGLE_CLIENT_SECRET }}
      STAGING_OPENAI_API_KEY: ${{ secrets.STAGING_OPENAI_API_KEY }}
      STAGING_STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
      STAGING_STRIPE_WEBHOOK_SECRET: ${{ secrets.STAGING_STRIPE_WEBHOOK_SECRET }}
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare secrets aren't set yet, so nothing was deployed."
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.creds.outputs.ok

      # Staging's runtime secrets, for both the staging Worker and previews, as a JSON file
      # Wrangler uploads with each deploy. Unset ones are left out.
      - name: Collect staging secrets
        if: steps.creds.outputs.ok && (env.PR != '' || env.TO_STAGING == 'true')
        run: |
          jq -n 'env | to_entries | map(select(.key | startswith("STAGING_")) | select(.value != ""))
                 | map({key: (.key | ltrimstr("STAGING_")), value}) | from_entries' > "$RUNNER_TEMP/staging-secrets.json"
          echo "Staging secrets set: $(jq -r 'keys | join(", ")' "$RUNNER_TEMP/staging-secrets.json")"
      - name: Make sure the D1 databases exist
        if: steps.creds.outputs.ok
        run: |
          npx wrangler d1 info pulsar > /dev/null 2>&1 || npx wrangler d1 create pulsar
          npx wrangler d1 info pulsar-staging > /dev/null 2>&1 || npx wrangler d1 create pulsar-staging

      # Production: only from main (or a manual run), and only production migrates its own
      # database. A PR's unmerged migration never touches it.
      - name: Build for production
        if: steps.creds.outputs.ok && env.TO_PRODUCTION == 'true'
        run: npm run build
        env:
          BASE: /
      - name: Apply production database migrations
        if: steps.creds.outputs.ok && env.TO_PRODUCTION == 'true'
        run: npx wrangler d1 migrations apply pulsar --env "" --remote
      - name: Deploy to production
        if: steps.creds.outputs.ok && env.TO_PRODUCTION == 'true'
        run: npx wrangler deploy --env ""

      # Staging: after every production deploy, or on demand for any branch.
      - name: Build for staging
        if: steps.creds.outputs.ok && env.TO_STAGING == 'true'
        run: npm run build
        env:
          BASE: /
          VITE_STAGE: staging
      - name: Apply staging database migrations
        if: steps.creds.outputs.ok && env.TO_STAGING == 'true'
        run: npx wrangler d1 migrations apply pulsar-staging --env staging --remote
      - name: Deploy to staging
        if: steps.creds.outputs.ok && env.TO_STAGING == 'true'
        run: npx wrangler deploy --env staging --secrets-file "$RUNNER_TEMP/staging-secrets.json"

      # PR preview: the staging database gets the PR's migrations, so the preview runs on its
      # schema. Closing the PR unmerged rebuilds staging from main (reset job below).
      - name: Build PR preview
        if: steps.creds.outputs.ok && env.PR != ''
        run: npm run build
        env:
          BASE: /
          # PR builds get their own IndexedDB name, app name and header badge.
          VITE_PREVIEW_PR: ${{ env.PR }}
      - name: Apply the PR's migrations to the staging database
        if: steps.creds.outputs.ok && env.PR != ''
        run: npx wrangler d1 migrations apply pulsar-staging --env staging --remote
      - name: Deploy PR preview
        id: preview
        if: steps.creds.outputs.ok && env.PR != ''
        run: |
          npx wrangler preview --name "pr-$PR" --json \
            --message "PR #$PR ${{ github.event.pull_request.head.sha }}" \
            --secrets-file "$RUNNER_TEMP/staging-secrets.json" > preview.json
          cat preview.json
          url=$(jq -r '[.preview.urls[]?, .deployment.urls[]?] | map(if type == "object" then .url else . end) | first // empty' preview.json 2>/dev/null || true)
          [ -n "$url" ] || url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' preview.json | head -1 || true)
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"
      - uses: marocchino/sticky-pull-request-comment@v2
        if: steps.preview.outputs.url
        with:
          header: cloudflare-preview
          message: |
            ☁️ **Cloudflare preview:** ${{ steps.preview.outputs.url }}/app/ (homepage: ${{ steps.preview.outputs.url }}/)

            Built from ${{ github.event.pull_request.head.sha }}. Runs on staging: Google sign-in (through staging.pulsarworkouts.app), hosted AI on the staging key, and Stripe test checkout (card 4242 4242 4242 4242). Accounts live in the shared staging database; workout data stays on your device, separate from the live app.

  # A closed PR: delete its preview, and if it changed the database schema without being
  # merged, rebuild the staging database from main so the change doesn't linger.
  closed:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PR: ${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok
        with:
          ref: main
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.creds.outputs.ok
      - name: Delete the PR's preview
        if: steps.creds.outputs.ok
        run: npx wrangler preview delete --name "pr-$PR" --skip-confirmation || echo "No preview to delete."
      - name: Did the PR change the database schema?
        id: schema
        if: steps.creds.outputs.ok && !github.event.pull_request.merged
        run: |
          if gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate --jq '.[].filename' | grep -q '^worker/migrations/'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild the staging database from main
        if: steps.schema.outputs.changed
        run: scripts/reset-staging-db.sh

  reset-staging-database:
    if: inputs.action == 'reset-staging-database'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild the staging database from this branch's migrations
        run: scripts/reset-staging-db.sh
