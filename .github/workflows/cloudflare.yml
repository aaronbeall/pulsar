name: Cloudflare

# Deploys the site (homepage, app, API) as the "pulsar" Cloudflare Worker (wrangler.jsonc):
# - push to main: `wrangler deploy` to production;
# - same-repo PR: `wrangler versions upload --preview-alias pr-<n>`, a preview URL that
#   doesn't touch production, posted as a sticky comment.
# Needs repo secrets CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers") and
# CLOUDFLARE_ACCOUNT_ID. Until they're set every run skips the deploy steps and passes.

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  # One group per PR (or main): a newer push supersedes a pending deploy of the same ref
  # without cancelling anyone else's.
  group: cloudflare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare secrets aren't set yet, so nothing was deployed."
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.creds.outputs.ok
      - run: npm run build
        if: steps.creds.outputs.ok
        env:
          BASE: /
          # PR builds get their own IndexedDB name and app name (see vite.config.ts).
          VITE_PREVIEW_PR: ${{ env.PR }}

      - name: Deploy to production
        if: steps.creds.outputs.ok && github.event_name != 'pull_request'
        run: npx wrangler deploy

      - name: Upload PR preview
        id: preview
        if: steps.creds.outputs.ok && github.event_name == 'pull_request'
        run: |
          npx wrangler versions upload --preview-alias "pr-$PR" --message "PR #$PR ${{ github.event.pull_request.head.sha }}" | tee upload.log
          url=$(grep -oE 'https://pr-[0-9]+-[^ ]+\.workers\.dev' upload.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - uses: marocchino/sticky-pull-request-comment@v2
        if: steps.preview.outputs.url
        with:
          header: cloudflare-preview
          message: |
            ☁️ **Cloudflare preview:** ${{ steps.preview.outputs.url }}/app/ (homepage: ${{ steps.preview.outputs.url }}/)

            Built from ${{ github.event.pull_request.head.sha }}. The preview has its own origin, so its workout data is separate from the live app.
