name: Record AI replies

# Records real OpenAI replies for the e2e tests and tester accounts (worker/ai/recordings/)
# and commits them to the branch it runs on. Run it from the Actions tab ("Run workflow",
# pick the branch) after changing the AI prompts or the recording cases. Costs a few cents.
# Needs the repo secret OPENAI_API_KEY (Settings > Secrets and variables > Actions).

on:
  workflow_dispatch:
    inputs:
      which:
        description: 'Which replies to record'
        type: choice
        options: [missing or stale, all]
        default: missing or stale
      only:
        description: 'Or only these case ids (comma-separated)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: record-ai-${{ github.ref }}

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Record
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ONLY: ${{ inputs.only }}
          WHICH: ${{ inputs.which }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Add the repo secret OPENAI_API_KEY first (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          args=()
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); elif [ "$WHICH" = "all" ]; then args+=(--all); fi
          npm run ai:record -- "${args[@]}"
      - name: Check the recordings
        run: npx vitest run worker/ai/replay.test.ts
      - name: Commit
        run: |
          if git diff --quiet -- worker/ai/recordings/replies.json; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/ai/recordings/replies.json
          git commit -m "Record AI replies"
          git push
