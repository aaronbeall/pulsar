name: Deploy Vite app to GitHub Pages

# Publishes main to the root of the gh-pages branch. PR previews live in pr-<n>/ folders on
# the same branch (see pr-preview.yml), so this deploy leaves those folders in place.
# Requires Settings > Pages > Source = "Deploy from a branch", branch gh-pages, folder / (root).

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Shared with pr-preview.yml so pushes to gh-pages never race each other.
  group: gh-pages-branch
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE: /pulsar/
      - run: |
          touch dist/.nojekyll
          node scripts/make-pages-404.mjs
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
          clean-exclude: |
            pr-*/
